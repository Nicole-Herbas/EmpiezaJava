<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <title>Sumador</title>
  </head>
  <body>
    <h1>Sumador</h1>
    <form id="sumar-form">
      <label for="primer-numero">Primer número:</label>
      <input type="number" id="primer-numero" />
      <label for="segundo-numero">Segundo número:</label>
      <input type="number" id="segundo-numero" />
      <input type="submit" value="Sumar" id="sumar-button" />
    </form>
    <div id="resultado-div"></div>
    <h1>Multiplicador</h1>
    <form id="multiplicar-form">
      <label for="primer-numero1">Primer número:</label>
      <input type="number" id="primer-numero1" />
      <label for="segundo-numero1">Segundo número:</label>
      <input type="number" id="segundo-numero1" />
      <input type="button" value="Multiplicar" id="multiplicar-button" />
    </form>
    <div id="resultado-div-multiplicar"></div>

    <h1>Saludador</h1>
    <form id="saludar-form">
      <label for="nombre">Ingresa tu nombre:</label>
      <input type="text" id="nombre" />
      <label for="edad">Ingresa tu edad:</label>
      <input type="number" id="edad" min="0" placeholder="Ingresa tu edad" required />
      <label for="genero">Ingresa tu género:</label>
      <select id="genero">
        <option value="femenino">Femenino</option>
        <option value="masculino">Masculino</option>
        <option value="prefiero no especificar">Prefiero no especificar</option>
      </select>
      <label for="idioma">Ingresa el idioma:</label>
      <select id="idioma">
        <option value="es">Español</option>
        <option value="en">Inglés</option>
      </select>
      <input type="button" value="Saludar" id="saludar-button" />
    </form>
    <div id="saludar-div"></div>


    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
